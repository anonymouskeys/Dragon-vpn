      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test ByeDPI routing integration
        shell: pwsh
        run: |
          @'
          {
            "test": {
              "runner": "Microsoft.Testing.Platform"
            }
          }
          '@ | Set-Content -Path .\global.json -Encoding utf8

          dotnet test `
            --project .\v2rayN-src\v2rayN\ServiceLib.Tests\ServiceLib.Tests.csproj `
            --configuration Release `
            -- --report-trx

      - name: Build Dragon VPN
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          dotnet publish .\v2rayN-src\v2rayN\v2rayN\v2rayN.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:EnableWindowsTargeting=true `
            --output .\package
          dotnet publish .\v2rayN-src\v2rayN\AmazTool\AmazTool.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishTrimmed=true `
            -p:EnableWindowsTargeting=true `
            --output .\package

      - name: Add v2rayN network cores
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-windows-64.zip" `
            -OutFile cores.zip
          Expand-Archive cores.zip -DestinationPath cores
          Copy-Item -Recurse -Force .\cores\v2rayN-windows-64\bin .\package\bin

      - name: Add official ByeDPI
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "DragonVPN-Windows-build" }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/hufrea/byedpi/releases/tags/v$env:BYEDPI_VERSION"
          $asset = $release.assets | Where-Object {
            $_.name -match "x86_64.*w64.*\.zip$"
          } | Select-Object -First 1
          if (-not $asset) {
            throw "Windows x64 ByeDPI archive was not found in release v$env:BYEDPI_VERSION"
          }
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile byedpi.zip
          New-Item -ItemType Directory -Force .\package\bin\byedpi | Out-Null
          Expand-Archive byedpi.zip -DestinationPath .\package\bin\byedpi
          if (-not (Test-Path .\package\bin\byedpi\ciadpi.exe)) {
            throw "ciadpi.exe is missing after extracting ByeDPI"
          }

      - name: Add simple Russian instructions
        shell: pwsh
        run: |
          @'
          Dragon VPN для Windows

          1. Распакуйте ZIP в обычную папку.
          2. Запустите DragonVPN.exe.
          3. Выберите сервер.
          4. Внизу окна включите переключатель «ByeDPI защита».
          5. Нажмите «Установить системный прокси» или включите TUN.

          ByeDPI запускается и выключается автоматически вместе с Dragon VPN.
          Параметр maxSplit в Windows остаётся равен 0 (без ограничения).
          '@ | Set-Content -Encoding UTF8 .\package\README_RU.txt

      - name: Verify package
        shell: pwsh
        run: |
          $required = @(
            ".\package\DragonVPN.exe",
            ".\package\bin\byedpi\ciadpi.exe",
            ".\package\bin\xray\xray.exe",
            ".\package\bin\sing_box\sing-box.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required file: $file" }
          }
          Get-FileHash .\package\DragonVPN.exe, .\package\bin\byedpi\ciadpi.exe `
            -Algorithm SHA256 | Format-Table

      - name: Create archive
        shell: pwsh
        run: |
          Move-Item .\package .\DragonVPN-Windows-x64
          7z a -tzip .\DragonVPN-Windows-x64.zip .\DragonVPN-Windows-x64 -mx=5

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DragonVPN-Windows-x64
          path: DragonVPN-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

