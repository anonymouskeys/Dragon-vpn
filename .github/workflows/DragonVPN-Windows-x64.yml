name: DragonVPN Windows x64

on:
  workflow_dispatch:
  push:
    branches: [monster-base]
    paths:
      - "windows/**"
      - "V2rayNG/app/src/main/res/values*/**"
      - ".github/workflows/DragonVPN-Windows-x64.yml"

permissions:
  contents: read

env:
  XRAY_COMMIT: 52a412d9e2f5
  BYEDPI_VERSION: "0.17.3"
  WINTUN_VERSION: "0.14.1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout DragonVPN
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false

      - name: Build the same Xray generation used by Android
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/XTLS/Xray-core.git xray-core
          git -C xray-core checkout $env:XRAY_COMMIT
          New-Item -ItemType Directory -Force package\bin | Out-Null
          Push-Location xray-core
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w" -o ..\package\bin\xray.exe .\main
          Pop-Location
          .\package\bin\xray.exe version

      - name: Set up MSYS2 for the repository TUN engine
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            gcc
            make

      - name: Build hev-socks5-tunnel for Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYS=winsymlinks:sys
          while read -r mode _ _ path; do
            if [ "$mode" = "120000" ] && [ ! -L "$path" ]; then
              target="$(cat "$path")"
              rm -f "$path"
              ln -s "$target" "$path"
            fi
          done < <(git ls-files -s hev-socks5-tunnel)
          make -C hev-socks5-tunnel
          cp hev-socks5-tunnel/bin/hev-socks5-tunnel package/bin/hev-socks5-tunnel.exe
          cp /usr/bin/msys-2.0.dll package/bin/msys-2.0.dll
          ldd package/bin/hev-socks5-tunnel.exe

      - name: Add pinned Wintun driver
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item "wintun\wintun-$env:WINTUN_VERSION\bin\amd64\wintun.dll" package\bin\wintun.dll

      - name: Add official ByeDPI
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "DragonVPN-Windows-build" }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/hufrea/byedpi/releases/tags/v$env:BYEDPI_VERSION"
          $asset = $release.assets | Where-Object { $_.name -match "x86_64.*w64.*\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "Windows x64 ByeDPI archive was not found" }
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile byedpi.zip
          New-Item -ItemType Directory -Force package\bin\byedpi | Out-Null
          Expand-Archive byedpi.zip -DestinationPath package\bin\byedpi
          if (-not (Test-Path package\bin\byedpi\ciadpi.exe)) { throw "ciadpi.exe is missing" }

      - name: Validate Fragment maxSplit zero in Xray
        shell: pwsh
        run: |
          @'
          {
            "inbounds": [{"listen":"127.0.0.1","port":10808,"protocol":"socks","settings":{"udp":true}}],
            "outbounds": [{
              "tag":"proxy","protocol":"freedom","settings":{},
              "streamSettings":{"network":"tcp","security":"none","finalmask":{"tcp":[{"type":"fragment","settings":{"packets":"tlshello","length":"50-100","delay":"10-20","maxSplit":0}}]}}
            }]
          }
          '@ | Set-Content -Encoding utf8 fragment-test.json
          .\package\bin\xray.exe run -test -c fragment-test.json

      - name: Build DragonVPN interface
        shell: pwsh
        run: |
          dotnet publish windows\DragonVPN\DragonVPN.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output windows\publish
          Copy-Item windows\publish\* package -Recurse -Force

      - name: Build four-language installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows\publish | Out-Null
          Copy-Item package\* windows\publish -Recurse -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\DragonVPN.iss
          Copy-Item windows\installer\output\DragonVPN-Setup-x64.exe DragonVPN-Setup-x64.exe

      - name: Verify clean DragonVPN package
        shell: pwsh
        run: |
          $required = @(
            "package\DragonVPN.exe",
            "package\bin\xray.exe",
            "package\bin\hev-socks5-tunnel.exe",
            "package\bin\wintun.dll",
            "package\bin\byedpi\ciadpi.exe",
            "DragonVPN-Setup-x64.exe"
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing: $file" } }
          if (Get-ChildItem package -Recurse | Where-Object { $_.Name -match 'v2rayN|sing-box|mihomo' }) {
            throw "Foreign UI/core files found in DragonVPN package"
          }
          Get-FileHash DragonVPN-Setup-x64.exe -Algorithm SHA256 | Format-List

      - name: Upload DragonVPN installer
        uses: actions/upload-artifact@v4
        with:
          name: DragonVPN-Windows-x64
          path: DragonVPN-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
