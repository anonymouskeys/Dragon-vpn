name: Dragon VPN Windows x64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DragonVPN-Windows-x64.yml"

permissions:
  contents: read

env:
  V2RAYN_COMMIT: cef40d38eec545dbe5a736602549d2b72c4f64bc
