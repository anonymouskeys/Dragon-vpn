name: F-Droid Universal Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fdroid-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal F-Droid debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Verify repository target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "anonymouskeys/Dragon-vpn" ]; then
            echo "Refusing to build from unexpected repository: ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Checkout Dragon VPN
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: libcore/go.sum

      - name: Validate Dragon-core source
        run: |
          set -euo pipefail
          grep -F 'anonymouskeys/Dragon-core.git' buildScript/lib/core/get_source.sh
          grep -F 'PACKAGE_NAME=io.github.anonymouskeys.dragonvpn' nb4a.properties
          test -s buildScript/signing/dragonvpn-test.jks.b64
          bash -n buildScript/lib/core/get_source.sh

      - name: Prepare stable public test signing
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode buildScript/signing/dragonvpn-test.jks.b64 > release.keystore
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          KEYSTORE_PASS=dragonvpn-test
          ALIAS_NAME=dragonvpn-test
          ALIAS_PASS=dragonvpn-test
          EOF

      - name: Prepare Android build
        run: |
          chmod +x run gradlew buildScript/lib/core/get_source.sh
          ./run init action gradle

      - name: Build libcore
        run: ./run lib core

      - name: Build universal F-Droid test APK
        env:
          BUILD_PLUGIN: none
        run: ./gradlew --no-daemon app:assembleFdroidDebug

      - name: Collect universal APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/fdroid/debug -type f -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Universal F-Droid APK was not produced"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/DragonVPN-fdroid-universal-test.apk
          EXPECTED_PACKAGE="io.github.anonymouskeys.dragonvpn.test"
          ACTUAL_PACKAGE="$(${ANDROID_HOME}/build-tools/35.0.1/aapt dump badging artifacts/DragonVPN-fdroid-universal-test.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [ "$ACTUAL_PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "Unexpected APK package: $ACTUAL_PACKAGE (expected $EXPECTED_PACKAGE)"
            exit 1
          fi
          ${ANDROID_HOME}/build-tools/35.0.1/apksigner verify --verbose --print-certs artifacts/DragonVPN-fdroid-universal-test.apk > artifacts/DragonVPN-fdroid-universal-test.apk.cert.txt
          {
            echo "package=$ACTUAL_PACKAGE"
            echo "source_repository=$GITHUB_REPOSITORY"
            echo "source_commit=$GITHUB_SHA"
          } > artifacts/DragonVPN-fdroid-universal-test.apk.metadata.txt
          sha256sum artifacts/DragonVPN-fdroid-universal-test.apk > artifacts/DragonVPN-fdroid-universal-test.apk.sha256

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonVPN-fdroid-universal-test-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
