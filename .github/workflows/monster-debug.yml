name: DragonVPN Main Signed APK

on:
  push:
    branches:
      - monster-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragonvpn-main-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build ByeDPI native binaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compile-byedpi.sh
          ./compile-byedpi.sh

      - name: Build hev-socks5-tunnel native libraries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x compile-hevtun.sh
          ./compile-hevtun.sh

          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Validate native runtime payload
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s "V2rayNG/app/libs/$abi/libhev-socks5-tunnel.so"
            test -s "V2rayNG/app/libs/$abi/libhevsockstun.so"
            test -s "V2rayNG/app/libs/$abi/libciadpi.so"
            file "V2rayNG/app/libs/$abi/libhev-socks5-tunnel.so"
            file "V2rayNG/app/libs/$abi/libhevsockstun.so"
            file "V2rayNG/app/libs/$abi/libciadpi.so"
          done

      - name: Download Xray Android library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/libs
          rm -f V2rayNG/app/libs/libv2ray.aar

          gh release download \
            --repo 2dust/AndroidLibXrayLite \
            --pattern 'libv2ray.aar' \
            --dir V2rayNG/app/libs

          test -s V2rayNG/app/libs/libv2ray.aar
          unzip -t V2rayNG/app/libs/libv2ray.aar >/dev/null
          echo "Downloaded libv2ray.aar:"
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Validate release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing"
              exit 1
            fi
          done

      - name: Restore release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dragonvpn-release.jks"
          test -s "$RUNNER_TEMP/dragonvpn-release.jks"

      - name: Build signed F-Droid release APK
        working-directory: V2rayNG
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/dragonvpn-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleFdroidRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify native libraries in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find V2rayNG/app/build/outputs/apk/fdroid/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' ! -name '*unaligned*' | head -n 1)"
          test -n "$APK"
          test -s "$APK"

          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fq "lib/$abi/libhev-socks5-tunnel.so" "$RUNNER_TEMP/apk-files.txt"
            grep -Fq "lib/$abi/libhevsockstun.so" "$RUNNER_TEMP/apk-files.txt"
            grep -Fq "lib/$abi/libciadpi.so" "$RUNNER_TEMP/apk-files.txt"
          done

          echo "Verified native payload in $APK"
          grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/(libhev-socks5-tunnel|libhevsockstun|libciadpi)\.so' "$RUNNER_TEMP/apk-files.txt"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find V2rayNG/app/build/outputs/apk/fdroid/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' ! -name '*unaligned*' | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/dragonvpn-signing-certificate.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/dragonvpn-signing-certificate.txt"

      - name: Prepare signed update artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find V2rayNG/app/build/outputs/apk/fdroid/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' ! -name '*unaligned*' | head -n 1)"
          APP_VERSION="$(sed -n 's/.*versionName = "\([^" ]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          mkdir -p release-signed
          cp "$APK" "release-signed/DragonVPN-v${APP_VERSION}-universal-signed.apk"
          cp "$RUNNER_TEMP/dragonvpn-signing-certificate.txt" release-signed/DragonVPN-signing-certificate.txt
          sha256sum "release-signed/DragonVPN-v${APP_VERSION}-universal-signed.apk" > "release-signed/DragonVPN-v${APP_VERSION}-universal-signed.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonVPN-Xray-fdroid-release-signed
          path: release-signed/
          if-no-files-found: error
          retention-days: 14
